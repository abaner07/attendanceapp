<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check in · Hookem</title><link rel="stylesheet" href="/style.css"><script defer src="/checkin.js"></script></head><body class="checkin-page"><main class="checkin-card card"><div class="brand">H<span>HOOKEM<small>MEETING ATTENDANCE</small></span></div><div class="eyebrow">GOOD TO SEE YOU</div><h1 id="title">Meeting check-in</h1><p class="muted">A little presence goes a long way.</p><div id="notice" role="status" hidden></div><form id="checkin-form"><label>UT EID<input name="eid" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="abc123" required maxlength="20" pattern="[a-zA-Z][a-zA-Z0-9]{1,19}"></label><label>Full name<input name="name" autocomplete="name" placeholder="Your first and last name" required minlength="2" maxlength="100"></label><button id="submit">Count me in →</button></form><p class="hint">Your EID, name, and check-in time are saved for the meeting organizer. This is self-reported attendance; no UT login is requested.</p></main></body></html>
